[project]
name = "ai-studio"
version = "0.3.0"
description = "Local-first, terminal-driven AI video studio (FFmpeg backbone, swappable AI workers)"
requires-python = ">=3.12"
dependencies = ["typer", "pydantic>=2", "numpy", "opencv-python", "rembg[cpu]", "faster-whisper", "pillow"]

[project.optional-dependencies]
test = ["pytest", "onnx"]

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["studio"]

[tool.setuptools.package-data]
studio = ["ui.html", "recipes.json", "workers.json"]
